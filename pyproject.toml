[project]
name = "omniquant"
version = "0.1.0"
description = "Industrial-grade multi-asset quant trading system powered by System 2 TradingAgents, System 1 Laya, and System 0 Execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "ccxt>=4.4.0",
    "torch>=2.4.0",
    "transformers>=4.48.0",
    "laya>=0.3.0",
    "openbb-core>=1.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
